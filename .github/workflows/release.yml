name: Release

on:
  push:
    tags:
      - "v*"

# Library release strategy: the test gate below is sufficient.
# No binary to build or Docker image to push.

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v6
        with:
          go-version-file: "go.mod"

      - name: Run test suite
        run: make test
